<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitTab — Split bills. Skip the math.</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fff; color: #0f172a; min-height: 100vh; display: flex; flex-direction: column; }
    .hero { background: #16A34A; color: #fff; padding: 80px 24px 64px; text-align: center; }
    .hero h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.5px; }
    .hero p { font-size: 20px; opacity: 0.9; margin-top: 12px; }
    .content { max-width: 560px; margin: 0 auto; padding: 60px 24px; text-align: center; flex: 1; }
    .desc { font-size: 16px; color: #475569; line-height: 1.7; margin-bottom: 40px; }
    .badges { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .badge { display: inline-block; background: #0f172a; color: #fff; padding: 12px 28px; border-radius: 12px; font-size: 15px; font-weight: 600; text-decoration: none; }
    .badge:hover { background: #1e293b; }
    .footer { text-align: center; padding: 32px 24px; border-top: 1px solid #e2e8f0; font-size: 13px; color: #94a3b8; }
    .footer a { color: #16A34A; text-decoration: none; margin: 0 8px; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>SplitTab</h1>
    <p>Split bills. Skip the math.</p>
  </div>

  <div class="content">
    <p class="desc">Enter a bill, pick a tip, choose how many people — and get the answer instantly. Share the breakdown with your group in one tap.</p>
    <div class="badges">
      <a class="badge" href="#">Download on the App Store</a>
      <a class="badge" href="#">Get it on Google Play</a>
    </div>
  </div>

  <div class="footer">
    &copy; 2026 SplitTab &mdash;
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Use</a>
  </div>
</body>
</html>
